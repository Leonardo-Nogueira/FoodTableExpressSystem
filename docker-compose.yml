services:
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    expose:
      - '3306'
    environment:
      MYSQL_USER: auth
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: authdb
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      