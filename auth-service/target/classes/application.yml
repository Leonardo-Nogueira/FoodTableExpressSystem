server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: auth
    password: password
  
  sql:
    init:
      mode: always
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  public-key: classpath:app.pub
  private-key: classpath:app.key     
      
    