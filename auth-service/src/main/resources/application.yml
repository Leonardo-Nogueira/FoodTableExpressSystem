server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/authdb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:password}
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

jwt:
  public-key: classpath:app.pub
  private-key: classpath:app.key     
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.foodtable.express.auth: DEBUG
      
    